# SonarQube Cloud configuration, read by Automatic Analysis from the repo
# root. (The older `.sonarcloud.properties` name is not picked up.)

# go:S4036 — "Make sure the PATH variable only contains fixed, unwriteable
# directories" — fires on every exec.Command/exec.CommandContext call that
# names a binary without a path separator.
#
# gomutants resolves `git` and `go` through PATH deliberately: it has to run
# the toolchain the developer has configured, which is what PATH is for.
# Pinning an absolute path would break version managers (gvm, asdf, mise) and
# any non-standard install location, and exec.LookPath — the usual
# remediation — is flagged by this same rule. There is no in-code fix that
# keeps the behaviour correct, so the rule is excluded rather than worked
# around at each call site.
#
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.go
